services:
  db:
    image: postgres:16-alpine # postgres16 精簡版 - alpine體積小
    container_name: pace-lab-db
    restart: unless-stopped
    environment: # 資料庫建立的帳號／密碼/DB名稱
      POSTGRES_USER: pacelab
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: pacelab_dev
    ports:
      - "5432:5432" # 容器內的port:主機的port
    volumes:
      - pace-lab-pgdata:/var/lib/postgresql/data

volumes:
  pace-lab-pgdata:
